name: Jev evaluation preview

on:
  push:
    branches: [codex/jev-event-quality]
    paths:
      - '.github/workflows/jev-preview.yml'
      - 'src/**'
      - 'scripts/build-static.mjs'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: jev-evaluation
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: jev-evaluation
    env:
      CMUEVENTS_RENDER_PUBLIC: '1'
      CMUEVENTS_LOG_PROGRESS: '1'
      OMP_THREAD_LIMIT: '1'
      CMUEVENTS_CONCURRENCY: '4'
      CMUEVENTS_BUILD_DATA_DIR: ${{ github.workspace }}/.cache/jev-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify both Jev decisions with the configured key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CMUEVENTS_JEV_LIVE: '1'
        run: node --test --test-name-pattern='configured Jev service' tests/jev-events.test.mjs
      - name: Install public-page and media runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr poppler-utils
          npx playwright install --with-deps chromium
      - name: Check offline regression and publication contracts
        run: |
          test ! -e research
          npm test
          npm run check
      - name: Restore cached OCR for published assets
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/media-ocr
          key: media-${{ runner.os }}-${{ hashFiles('src/lib/media-ocr.mjs', 'package-lock.json') }}-jev-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            media-${{ runner.os }}-${{ hashFiles('src/lib/media-ocr.mjs', 'package-lock.json') }}-
      - name: Build isolated preview from daily source state
        shell: bash
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          mkdir -p .cache/jev-export
          git fetch --depth=1 origin refs/heads/codex/crawl-state
          git show FETCH_HEAD:state.json > .cache/jev-state-in.json
          npm run build:static -- --output=.cache/jev-preview \
            --state-in=.cache/jev-state-in.json --state-out=.cache/jev-export/state.json \
            --jev-time=apply --jev-merge=apply
      - name: Upload diagnostic and decision reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jev-preview-reports
          path: .cache/jev-export/publication-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload static preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jev-calendar-preview
          path: .cache/jev-preview
          retention-days: 14
