name: Daily events and Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-pages.yml'
      - 'src/**'
      - 'web/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'data/event_sources.json'
      - 'LICENSE'
  schedule:
    - cron: '17 6 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      allow_event_drop:
        description: 'Allow a reviewed event-count decrease greater than 30%'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CMUEVENTS_RENDER_PUBLIC: '1'
      CMUEVENTS_CONCURRENCY: '4'
      CMUEVENTS_BUILD_DATA_DIR: ${{ github.workspace }}/.cache/daily-build
      ALLOW_EVENT_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_event_drop }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache raw OCR by source bytes and extractor version
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/media-ocr
          key: media-${{ runner.os }}-${{ hashFiles('src/lib/media-ocr.mjs', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            media-${{ runner.os }}-${{ hashFiles('src/lib/media-ocr.mjs', 'package-lock.json') }}-
      - name: Install public-page and media extraction runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr poppler-utils
          npx playwright install --with-deps chromium
      - name: Test and validate contracts
        run: |
          npm test
          npm run check
      - name: Restore durable source snapshots
        id: restore
        shell: bash
        run: |
          mkdir -p .cache/export
          if git ls-remote --exit-code --heads origin refs/heads/codex/crawl-state > .cache/state-ref; then
            git fetch --depth=1 origin refs/heads/codex/crawl-state
            state_head=$(git rev-parse FETCH_HEAD)
            git show "${state_head}:state.json" > .cache/state-in.json
            echo "head=${state_head}" >> "$GITHUB_OUTPUT"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 2 ]; then exit "$result"; fi
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch, validate and build public website
        shell: bash
        env:
          HAVE_STATE: ${{ steps.restore.outputs.available }}
        run: |
          args=(--output=dist --state-out=.cache/export/state.json)
          if [ "$HAVE_STATE" = true ]; then args+=(--state-in=.cache/state-in.json); fi
          if [ "$ALLOW_EVENT_DROP" = true ]; then args+=(--allow-event-drop); fi
          npm run build:static -- "${args[@]}"
      - name: Upload source-health and publication reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-source-health-${{ github.run_id }}
          path: .cache/export/publication-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save validated state for the next daily run
        shell: bash
        env:
          STATE_HEAD: ${{ steps.restore.outputs.head }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$STATE_HEAD" ]; then
            git worktree add --detach .cache/crawl-state-publish "$STATE_HEAD"
          else
            git worktree add --detach .cache/crawl-state-publish HEAD
            git -C .cache/crawl-state-publish switch --orphan codex/crawl-state
          fi
          cp .cache/export/state.json .cache/crawl-state-publish/state.json
          cp .cache/export/publication-report.json .cache/crawl-state-publish/report.json
          git -C .cache/crawl-state-publish add state.json report.json
          git -C .cache/crawl-state-publish commit -m "Update public source snapshots $(date -u +%F)"
          git -C .cache/crawl-state-publish push origin HEAD:refs/heads/codex/crawl-state
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the validated snapshot
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
